// ---------- Interaksi Menggambar & Menyeret (Desktop & Touch) ----------
let isDrawing = false;
let isPinching = false;
let pinchEndTime = 0;
let lastCell = null;
let currentStroke = []; // Array of { x, y, key, prevPx, prevQueue, prevDelQueue, consumedStock }

function revertStrokeCell(item) {
  const k = item.key;
  if (item.prevPx) {
    px.set(k, item.prevPx);
    paintDirectToTile(item.x, item.y, PAL[item.prevPx.c]);
  } else {
    px.delete(k);
    paintDirectToTile(item.x, item.y, null);
  }

  if (item.prevQueue) {
    queue.set(k, item.prevQueue);
  } else {
    queue.delete(k);
  }

  if (item.prevDelQueue) {
    delQueue.set(k, item.prevDelQueue);
  } else {
    delQueue.delete(k);
  }
}

function cancelDraw() {
  if (isDrawing) {
    while (currentStroke.length > 0) {
      const item = currentStroke.pop();
      revertStrokeCell(item);
    }
    isDrawing = false;
    lastCell = null;
    redraw();
    render();
  }
}

function handleDrawStart(latlng) {
  $('pal-popover').classList.remove('open');
  $('btn-palette-toggle').classList.remove('open');
  $('search-drawer').classList.remove('open');
  if (!me) return;
  if (Math.round(map.getZoom()) < MIN_DRAW_Z) {
    Sfx.click();
    map.setView(latlng, MIN_DRAW_Z);
    return toast('Mendekat otomatis ke level ' + MIN_DRAW_Z + ' untuk mulai menggambar');
  }
  const x = Math.floor(latlng.lng / CELL);
  const y = Math.floor(latlng.lat / CELL);

  if (activeMode === 'info') {
    showPixelInfo(x, y);
    return;
  }

  if (activeMode === 'pipette') {
    const k = key(x, y);
    if (px.has(k)) {
      col = px.get(k).c;
      try { localStorage.setItem('pixeldunia_col', col); } catch (e) {}
      updateActiveSwatch();
      document.querySelectorAll('.sw').forEach((s, j) => s.classList.toggle('on', j === col));
      Sfx.color();
      toast('Warna disalin: ' + PAL_NAMES[col]);
      setMode('draw');
    } else {
      Sfx.error();
      toast('Sel ini belum digambar');
    }
    return;
  }

  if (activeMode === 'erase') {
    isDrawing = true;
    lastCell = { x, y };
    currentStroke = [];

    const k = key(x, y);
    const prevPx = px.has(k) ? { ...px.get(k) } : null;
    const prevQueue = queue.has(k) ? { ...queue.get(k) } : null;
    const prevDelQueue = delQueue.has(k) ? { ...delQueue.get(k) } : null;

    if (paintCell(x, y)) {
      paintDirectToTile(x, y, null);
      currentStroke.push({
        x,
        y,
        key: k,
        prevPx,
        prevQueue,
        prevDelQueue,
        consumedStock: false,
        isErase: true
      });
      render();
    }
    updateCellPreview(x, y);
    return;
  }

  if (activeMode === 'draw') {
    isDrawing = true;
    lastCell = { x, y };
    currentStroke = [];

    const k = key(x, y);
    const prevPx = px.has(k) ? { ...px.get(k) } : null;
    const prevQueue = queue.has(k) ? { ...queue.get(k) } : null;
    const prevDelQueue = delQueue.has(k) ? { ...delQueue.get(k) } : null;
    const wasNew = !prevPx && !prevQueue;

    if (paintCell(x, y)) {
      paintDirectToTile(x, y, PAL[col]);
      currentStroke.push({
        x,
        y,
        key: k,
        prevPx,
        prevQueue,
        prevDelQueue,
        consumedStock: wasNew,
        wasNew,
        newColor: col
      });
      render();
    }
    updateCellPreview(x, y);
  }
}

function handleDrawMove(latlng) {
  if (!isDrawing || !lastCell) return;
  if (activeMode !== 'draw' && activeMode !== 'erase') return;

  const x = Math.floor(latlng.lng / CELL);
  const y = Math.floor(latlng.lat / CELL);
  if (x === lastCell.x && y === lastCell.y) return;

  const points = lineBresenham(lastCell.x, lastCell.y, x, y);
  let changed = false;
  const limit = Math.min(points.length, 60);

  if (activeMode === 'erase') {
    // Mode Hapus: Gores / swap langsung menghapus setiap pixel yang disentuh
    for (let i = 1; i < limit; i++) {
      const pt = points[i];
      const ptKey = key(pt.x, pt.y);
      const prevPx = px.has(ptKey) ? { ...px.get(ptKey) } : null;
      const prevQueue = queue.has(ptKey) ? { ...queue.get(ptKey) } : null;
      const prevDelQueue = delQueue.has(ptKey) ? { ...delQueue.get(ptKey) } : null;

      if (paintCell(pt.x, pt.y)) {
        paintDirectToTile(pt.x, pt.y, null);
        currentStroke.push({
          x: pt.x,
          y: pt.y,
          key: ptKey,
          prevPx,
          prevQueue,
          prevDelQueue,
          consumedStock: false,
          isErase: true
        });
        changed = true;
      }
    }
    lastCell = { x, y };
    updateCellPreview(x, y);
    if (changed) {
      render();
    }
    return;
  }

  // Mode Gores (Draw): Isi pixel langsung secara instan, dan jika menggores berlebih,
  // cukup tarik jari mundur ke goresan sebelumnya untuk otomatis menghapus kelebihannya.
  for (let i = 1; i < limit; i++) {
    const pt = points[i];
    const ptKey = key(pt.x, pt.y);

    // Cek apakah titik ini adalah titik terdahulu dalam goresan aktif (Backtracking)
    let backtrackIdx = -1;
    for (let j = currentStroke.length - 2; j >= 0; j--) {
      if (currentStroke[j].key === ptKey) {
        backtrackIdx = j;
        break;
      }
    }

    if (backtrackIdx !== -1) {
      // Jari ditarik mundur: Hapus kelebihan goresan yang terjadi setelah titik ini
      let revertedCount = 0;
      while (currentStroke.length > backtrackIdx + 1) {
        const excess = currentStroke.pop();
        revertStrokeCell(excess);
        revertedCount++;
        changed = true;
      }
      if (revertedCount > 0) {
        Sfx.erase();
      }
    } else {
      // Melanjutkan goresan maju: Jangan duplikasi jika sel sama persis dengan ekor goresan
      if (currentStroke.length > 0 && currentStroke[currentStroke.length - 1].key === ptKey) {
        continue;
      }

      if (avail() < 1 && !px.has(ptKey)) {
        if (!stockEmptyWarned) {
          stockEmptyWarned = true;
          Sfx.error();
          const fi = getTimeUntilFull();
          toast('Stok pixel habis! Penuh kembali dalam ' + fi.durationStr + ' (~' + fi.etaClock + ') atau ambil hadiah.');
          setTimeout(() => { stockEmptyWarned = false; }, 3000);
        }
        break;
      }

      const prevPx = px.has(ptKey) ? { ...px.get(ptKey) } : null;
      const prevQueue = queue.has(ptKey) ? { ...queue.get(ptKey) } : null;
      const prevDelQueue = delQueue.has(ptKey) ? { ...delQueue.get(ptKey) } : null;
      const wasNew = !prevPx && !prevQueue;

      if (paintCell(pt.x, pt.y)) {
        paintDirectToTile(pt.x, pt.y, PAL[col]);
        currentStroke.push({
          x: pt.x,
          y: pt.y,
          key: ptKey,
          prevPx,
          prevQueue,
          prevDelQueue,
          consumedStock: wasNew,
          wasNew,
          newColor: col
        });
        changed = true;
      }
    }
  }

  lastCell = { x, y };
  updateCellPreview(x, y);
  if (changed) {
    render();
  }
}

function handleDrawEnd() {
  if (isDrawing || currentStroke.length > 0) {
    isDrawing = false;
    if (currentStroke.length > 0) {
      undoStack.push([...currentStroke]);
      if (undoStack.length > 30) undoStack.shift();
      redoStack.length = 0;
      updateUndoRedoUI();
    }
    currentStroke = [];
    lastCell = null;
    // Hapus redraw() di sini agar tidak memicu flicker/kedip-kedip pada canvas grid
    render();
  }
}

// Mouse Desktop Events
map.getContainer().addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const latlng = map.mouseEventToLatLng(e);
  handleDrawStart(latlng);
});

window.addEventListener('mousemove', e => {
  if (Math.round(map.getZoom()) >= MIN_DRAW_Z) {
    const latlng = map.mouseEventToLatLng(e);
    const x = Math.floor(latlng.lng / CELL);
    const y = Math.floor(latlng.lat / CELL);
    updateCellPreview(x, y);
  } else if (map.hasLayer(cellPreview)) {
    map.removeLayer(cellPreview);
  }
  if (isDrawing && (activeMode === 'draw' || activeMode === 'erase')) {
    const latlng = map.mouseEventToLatLng(e);
    handleDrawMove(latlng);
  }
});

window.addEventListener('mouseup', () => handleDrawEnd());

map.getContainer().addEventListener('mouseleave', () => {
  if (map.hasLayer(cellPreview)) map.removeLayer(cellPreview);
});

// Touch Mobile Events (Mengenali Cubit Pinch Zoom vs Gores / Hapus)
map.getContainer().addEventListener('touchstart', e => {
  // Jika 2 jari atau lebih menyentuh layar, langsung batalkan goresan dan aktifkan cubit (pinch zoom)
  if (e.touches.length > 1) {
    isPinching = true;
    pinchEndTime = Date.now();
    cancelDraw();
    return; // Biarkan event diteruskan ke Leaflet touchZoom secara alami
  }

  // Jika baru saja melepas cubitan (dalam 350ms), cegah jari yang tersisa menggores
  if (isPinching || (Date.now() - pinchEndTime < 350)) {
    cancelDraw();
    return;
  }

  if (activeMode === 'draw' || activeMode === 'erase') {
    // 1 jari menyentuh: jalankan goresan / penghapusan
    e.preventDefault();
    const latlng = map.mouseEventToLatLng(e.touches[0]);
    handleDrawStart(latlng);
  }
}, { passive: false });

map.getContainer().addEventListener('touchmove', e => {
  // Jika 2 jari atau lebih bergerak, ini adalah gerakan cubit (pinch zoom)
  if (e.touches.length > 1) {
    if (!isPinching) {
      isPinching = true;
      cancelDraw();
    }
    pinchEndTime = Date.now();
    return; // Biarkan event diteruskan ke Leaflet touchZoom
  }

  // Jika status cubit masih aktif atau dalam masa jeda setelah cubit
  if (isPinching || (Date.now() - pinchEndTime < 350)) {
    cancelDraw();
    return;
  }

  if (isDrawing && (activeMode === 'draw' || activeMode === 'erase')) {
    e.preventDefault();
    const latlng = map.mouseEventToLatLng(e.touches[0]);
    handleDrawMove(latlng);
  }
}, { passive: false });

const handleTouchFinish = (e) => {
  if (e && e.touches && e.touches.length > 0) {
    // Masih ada jari menempel (misal salah satu jari diangkat saat cubit)
    if (isPinching) {
      pinchEndTime = Date.now();
      cancelDraw();
    }
    return;
  }

  // Semua jari telah terangkat dari layar
  if (isPinching) {
    isPinching = false;
    pinchEndTime = Date.now();
    cancelDraw();
    return;
  }

  if (Date.now() - pinchEndTime < 350) {
    cancelDraw();
    return;
  }

  handleDrawEnd();
};

map.getContainer().addEventListener('touchend', handleTouchFinish);
map.getContainer().addEventListener('touchcancel', handleTouchFinish);

map.on('click', e => {
  if (isPinching || (Date.now() - pinchEndTime < 350)) return;
  if (activeMode === 'draw' || activeMode === 'erase') return;
  handleDrawStart(e.latlng);
  handleDrawEnd();
});

setInterval(async () => {
  if (delQueue.size && !isDrawing) {
    const dq = [...delQueue.values()].slice(0, 20);
    dq.forEach(v => {
      delQueue.delete(key(v.x, v.y));
      ChunkCache.del(chunkKey(chunkCoord(v.x), chunkCoord(v.y)));
    });
    broadcastChunkPixels(dq, true);
    if (!SB_URL.includes('PROJECT-ID')) {
      const {data, error} = await sb.rpc('delete_pixels', {p: dq});
      if (error) console.warn(error.message);
      else if (data) setMe(data);
    }
  }
  if (!queue.size || isDrawing) return;
  if (SB_URL.includes('PROJECT-ID')) {
    let pendingNew = 0;
    queue.forEach(v => {
      if (v.isNew !== false) pendingNew++;
      checkPixelRegion(v.x, v.y);
    });
    me.stock = Math.max(0, me.stock - pendingNew);
    me.t = Date.now();
    me.day_placed = (me.day_placed || 0) + pendingNew;
    me.total_placed = (me.total_placed || 0) + pendingNew;
    queue.clear();
    try { localStorage.setItem('np_demo_me', JSON.stringify(me)); } catch (e) {}
    render();
    return;
  }
  const q = [...queue.values()].slice(0, 20);
  q.forEach(v => {
    checkPixelRegion(v.x, v.y);
    queue.delete(key(v.x, v.y));
    ChunkCache.del(chunkKey(chunkCoord(v.x), chunkCoord(v.y)));
  });
  broadcastChunkPixels(q, false);
  const {data, error} = await sb.rpc('place_pixels', {p: q});
  if (error) {
    toast(error.message);
    // Rollback rapi: hanya kembalikan pixel yang gagal, tidak merusak memori lain
    q.forEach(item => px.delete(key(item.x, item.y)));
    redraw();
    const s = await sb.rpc('get_state');
    if (s.data) setMe(s.data);
  } else if (data) {
    if (data.rejected && data.rejected.length > 0) {
      data.rejected.forEach(item => {
        px.delete(key(item.x, item.y));
      });
      redraw();
      toast('Sebagian pixel ditolak karena terlindungi oleh pemain lain.');
    }
    setMe(data);
  }
}, 1500);

// ---------- Toolbar Mode (Step 8: Gambar, Geser, Pipet, Hapus) ----------
function updateDraggingState() {
  if (Math.round(map.getZoom()) < MIN_DRAW_Z) {
    map.dragging.enable();
  } else {
    if (activeMode === 'draw' || activeMode === 'erase') map.dragging.disable();
    else map.dragging.enable();
  }
}
map.on('zoomend', updateDraggingState);

function setMode(mode) {
  activeMode = mode;
  isEraser = (mode === 'erase');

  $('btn-draw').classList.toggle('active', mode === 'draw');
  $('btn-draw').classList.toggle('on', mode === 'draw');

  if ($('btn-pan')) {
    $('btn-pan').classList.toggle('active', mode === 'pan');
    $('btn-pan').classList.toggle('on', mode === 'pan');
  }
  if ($('btn-info')) {
    $('btn-info').classList.toggle('active', mode === 'info');
    $('btn-info').classList.toggle('on', mode === 'info');
  }
  if ($('btn-pipette')) {
    $('btn-pipette').classList.toggle('active', mode === 'pipette');
    $('btn-pipette').classList.toggle('on', mode === 'pipette');
  }
  $('btn-erase').classList.toggle('active', mode === 'erase');
  $('btn-erase').classList.toggle('on', mode === 'erase');

  updateDraggingState();

  if (mode === 'draw') {
    $('map').style.cursor = 'crosshair';
    toast('Mode Gambar: gores langsung terisi, tarik mundur untuk hapus kelebihan');
  } else if (mode === 'pan') {
    $('map').style.cursor = 'grab';
    toast('Mode Geser: geser peta bebas, klik untuk pasang 1 px');
  } else if (mode === 'info') {
    $('map').style.cursor = 'help';
    toast('Mode Info: ketuk pixel di peta untuk melihat pembuatnya');
  } else if (mode === 'pipette') {
    $('map').style.cursor = 'copy';
    toast('Mode Pipet: ketuk pixel di peta untuk menyalin warnanya');
  } else if (mode === 'erase') {
    $('map').style.cursor = 'pointer';
    toast('Mode Hapus: seret/swap untuk menghapus banyak pixel');
  }

  if (mode === 'erase' || mode === 'info') {
    $('pal-popover').classList.remove('open');
    $('btn-palette-toggle').classList.remove('open');
    document.querySelectorAll('.sw').forEach(s => s.classList.remove('on'));
  } else {
    document.querySelectorAll('.sw').forEach((s, j) => s.classList.toggle('on', j === col));
  }
}

$('btn-draw').onclick = () => { Sfx.click(); setMode('draw'); };
if ($('btn-pan')) $('btn-pan').onclick = () => { Sfx.click(); setMode('pan'); };
if ($('btn-info')) $('btn-info').onclick = () => { Sfx.click(); setMode('info'); };
if ($('btn-pipette')) $('btn-pipette').onclick = () => { Sfx.click(); setMode('pipette'); };
$('btn-erase').onclick = () => { Sfx.click(); setMode('erase'); };

// Pintasan Keyboard Undo (Ctrl+Z) dan Redo (Ctrl+Y / Ctrl+Shift+Z)
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    if (e.shiftKey) {
      e.preventDefault();
      redoPixel();
    } else {
      e.preventDefault();
      undoPixel();
    }
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault();
    redoPixel();
  }
});

const dockToolbarEl = $('dock-toolbar');
const dockCueLeft = $('dock-cue-left');
const dockCueRight = $('dock-cue-right');

function updateDockCues() {
  if (!dockToolbarEl) return;
  const canScrollRight = dockToolbarEl.scrollWidth - dockToolbarEl.clientWidth - dockToolbarEl.scrollLeft > 6;
  const canScrollLeft = dockToolbarEl.scrollLeft > 6;
  if (dockCueRight) dockCueRight.classList.toggle('visible', canScrollRight);
  if (dockCueLeft) dockCueLeft.classList.toggle('visible', canScrollLeft);
}

if (dockToolbarEl) {
  dockToolbarEl.addEventListener('scroll', updateDockCues, { passive: true });
  window.addEventListener('resize', updateDockCues);
  setTimeout(updateDockCues, 150);
  setTimeout(updateDockCues, 600);
}

if (dockCueRight && dockToolbarEl) {

function checkPixelRegion(x, y) {
  if (!me) return;
  if (!me.regions_today) me.regions_today = [];
  if (!me.regions_alltime) me.regions_alltime = [];
  for (const r of REGIONS) {
    if (x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1) {
      if (!me.regions_today.includes(r.id)) me.regions_today.push(r.id);
      if (!me.regions_alltime.includes(r.id)) me.regions_alltime.push(r.id);
      break;
    }
  }
}
// ---------- Hadiah, Misi & Profil ----------


async function klaim(fn, args){
  if (SB_URL.includes('PROJECT-ID')) {
    if (fn === 'claim_daily') {
      me.last_daily = hariIni();
      me.streak = (me.streak || 0) + 1;
      me.best_streak = Math.max(me.best_streak || 0, me.streak);
      me.stock = Math.min(me.max_stock, me.stock + 50 + 10 * Math.min(me.streak, 7));
      toast('Hadiah harian diterima (+stok)');
    } else if (fn === 'claim_mission') {
      const mid = args && args.mid;
      const m = activeMissions.find(x => x.id === mid);
      if (m) {
        if (!me.claimed) me.claimed = [];
        me.claimed.push(mid);
        if (m.reward_stock > 0) me.stock = Math.min(me.max_stock, me.stock + m.reward_stock);
        if (m.reward_boost_min > 0) {
          const currentBoost = me.boost_until ? Math.max(Date.now(), new Date(me.boost_until).getTime()) : Date.now();
          me.boost_until = new Date(currentBoost + m.reward_boost_min * 60 * 1000).toISOString();
        }
        toast('Misi selesai: ' + m.title);
      }
    } else if (fn === 'claim_ad') {
      me.ads_today = (me.ads_today || 0) + 1;
      const rew = (cfg && cfg.ad_reward) || 25;
      me.stock = Math.min(me.max_stock, me.stock + rew);
      toast(`Hadiah iklan diterima (+${rew} stok pixel)`);
    } else if (fn === 'claim_ad_boost') {
      me.ad_boosts_today = (me.ad_boosts_today || 0) + 1;
      const currentBoost = me.boost_until ? Math.max(Date.now(), new Date(me.boost_until).getTime()) : Date.now();
      me.boost_until = new Date(currentBoost + 30 * 60 * 1000).toISOString();
      toast('Hadiah iklan diterima! Booster Pengisian (+30 Menit) aktif.');
    }
    if (me.stock >= me.max_stock) me.t = Date.now();
    try { localStorage.setItem('np_demo_me', JSON.stringify(me)); } catch (e) {}
    render();
    return panel();
  }
  if (fn === 'claim_ad_boost') {
    try {
      const {data, error} = await sb.rpc('claim_ad_boost', args);
      if (!error && data) {
        setMe(data);
        toast('Hadiah iklan diterima! Booster Pengisian (+30 Menit) aktif.');
        return panel();
      }
    } catch (e) {}
    me.ad_boosts_today = (me.ad_boosts_today || 0) + 1;
    const currentBoost = me.boost_until ? Math.max(Date.now(), new Date(me.boost_until).getTime()) : Date.now();
    me.boost_until = new Date(currentBoost + 30 * 60 * 1000).toISOString();
    toast('Hadiah iklan diterima! Booster Pengisian (+30 Menit) aktif.');
    render();
    return panel();
  }
  const {data, error} = await sb.rpc(fn, args);
  if (error) toast(error.message); else { setMe(data); toast('Hadiah diterima'); }
  panel();
}

let pendingInviteCode = '';
function checkUrlInvite() {
  const hash = window.location.hash || '';
  const search = window.location.search || '';
  const matchHash = hash.match(/invite=([A-Za-z0-9]{6,8})/i);
  const matchSearch = search.match(/invite=([A-Za-z0-9]{6,8})/i);
  if (matchHash && matchHash[1]) pendingInviteCode = matchHash[1].toUpperCase();
  else if (matchSearch && matchSearch[1]) pendingInviteCode = matchSearch[1].toUpperCase();
  if (pendingInviteCode) {
    setTimeout(() => {
      toast('Kode undangan terdeteksi: ' + pendingInviteCode + '. Buka menu Hadiah untuk menggunakannya.');
    }, 1200);
  }
}

async function tontonIklan(type = 'stock'){
  const isBoost = type === 'boost';
  if (isBoost) {
    if ((me.ad_boosts_today || 0) >= 5) {
      toast('Batas tonton iklan booster hari ini sudah tercapai (5/5).');
      return;
    }
  } else {
    const cap = (cfg && cfg.ad_daily_cap) || 5;
    if ((me.ads_today || 0) >= cap) {
      toast('Batas tonton iklan stok pixel hari ini sudah tercapai.');
      return;
    }
  }

  if (!SB_URL.includes('PROJECT-ID')) {
    try {
      const s = await sb.rpc('start_ad');
      if (s && s.error && !isBoost) { toast(s.error.message); return panel(); }
    } catch (e) {}
  }

  const title = isBoost ? 'Iklan Booster Pixel (+30 Menit)' : `Iklan Hadiah (+${(cfg && cfg.ad_reward) || 25} Pixel)`;
  const duration = Math.min((cfg && cfg.ad_min_sec) || 5, 5);

  $('card').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <b style="font-size:14px;color:#fff">${esc(title)}</b>
      <span style="font-size:10px;font-weight:900;color:#f59e0b;background:rgba(245,158,11,0.15);padding:3px 8px;border-radius:4px">SPONSORED AD</span>
    </div>
    <div style="background:rgba(0,0,0,0.35);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:22px 16px;text-align:center;margin-bottom:12px">
      <div style="margin-bottom:10px">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="${isBoost ? '#f97316' : '#3b82f6'}" stroke-width="2.2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <div style="font-size:13px;font-weight:800;color:#fff;margin-bottom:4px">Menayangkan Iklan Sponsor...</div>
      <div id="ads" style="font-size:12px;color:var(--mut)">Memulai video (${duration} detik)...</div>
    </div>
    <div style="font-size:11px;color:#94a3b8;text-align:center;line-height:1.4">Tonton iklan sponsor hingga selesai untuk menerima ${isBoost ? 'booster isi ulang 2x (+30m)' : 'tambahan stok pixel gratis'}. Pendapatan iklan mendukung kelangsungan server NusaPixel.</div>
  `;

  for (let i = duration; i > 0; i--) {
    if (!$('ads')) break;
    $('ads').textContent = `Video sponsor berjalan: sisa ${i} detik...`;
    await new Promise(r => setTimeout(r, 1000));
  }

  if (isBoost) {
    await klaim('claim_ad_boost');
  } else {
    await klaim('claim_ad');
  }
}

async function cari(){
  const q = $('q').value.trim(); if (!q) return;
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=id&q=' + encodeURIComponent(q));
    const d = await r.json();
    if (!d.length) return toast('Tempat tidak ditemukan di Indonesia');
    map.setView([+d[0].lat, +d[0].lon], 17);
    $('search-drawer').classList.remove('open');
    if ($('zoom-banner')) $('zoom-banner').style.visibility = '';
  } catch { toast('Pencarian gagal. Coba lagi sebentar lagi.'); }
}

    const ll = [p.coords.latitude, p.coords.longitude];
    if (!L.latLngBounds([[-11.5, 94.5], [6.5, 141.5]]).contains(ll)) return toast('Lokasimu di luar wilayah Indonesia');
    map.setView(ll, 17);
  }, () => toast('Izin lokasi ditolak. Aktifkan di pengaturan browser.'));
};

async function shareCoordinates() {
  Sfx.click();
  const c = map.getCenter();
  const z = Math.round(map.getZoom());
  const x = Math.floor(c.lng / CELL);
  const y = Math.floor(c.lat / CELL);
  const hash = `#${z}/${c.lat.toFixed(5)}/${c.lng.toFixed(5)}`;
  const shareUrl = location.origin + location.pathname + hash;

  history.replaceState(null, '', location.pathname + hash);

  let shared = false;
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'NusaPixel',
        text: `Lihat gambar pixel art di koordinat (${x}, ${y})!`,
        url: shareUrl
      });
      shared = true;
    } catch (err) {}
  }

  if (!shared) {
    try {
      await navigator.clipboard.writeText(shareUrl);
      toast(`Tautan koordinat disalin: (X: ${x}, Y: ${y})`);
    } catch {
      uiPrompt({
        title: 'Salin Tautan Koordinat',
        desc: `Salin tautan koordinat (X: ${x}, Y: ${y}) berikut:`,
        value: shareUrl,
        confirmText: 'Selesai',
        cancelText: 'Tutup'
      });
    }
  }
}

// Helper timeout agar request async tidak memblokir game selamanya
function withTimeout(promise, ms = 4000) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout ' + ms + 'ms')), ms))
  ]);
}

    isAnon = !user || !!user.is_anonymous;
    currentUserEmail = user?.email || (user?.user_metadata && user.user_metadata.email) || '';
    if (!isAnon && user) {
      const gName = (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || currentUserEmail;
      const gAvatar = user.user_metadata && (user.user_metadata.avatar_url || user.user_metadata.picture);
      if (gAvatar && !localStorage.getItem('np_user_avatar')) {
        try { localStorage.setItem('np_user_avatar', gAvatar); } catch (e) {}
      }
      if (currentUserEmail) {
        try { localStorage.setItem('np_user_email', currentUserEmail); } catch (e) {}
      }
      if (gName && !localStorage.getItem('np_user_nick')) {
        try { localStorage.setItem('np_user_nick', gName); } catch (e) {}
      }
      toast('Berhasil masuk sebagai ' + gName);
    }

    const ep = new URLSearchParams(location.search);
    if (ep.get('error_description')) {
      toast('Gagal menghubungkan akun: ' + ep.get('error_description') + '. Kalau akun sudah terdaftar, silakan tekan Masuk.');
      history.replaceState(null, '', location.pathname);
    }

    try {
      const cfgRes = await withTimeout(sb.from('config').select('*').single(), 3000);
      if (cfgRes?.data) cfg = { ...cfg, ...cfgRes.data };
    } catch (e) {
      console.warn('Gagal mengambil remote config:', e);
    }

    try {
      await withTimeout(loadMissions(), 3000);
    } catch (e) {}

    try {
      const { data: isAdm } = await withTimeout(sb.rpc('is_admin'), 2500);
      isAdminUser = !!isAdm;
    } catch (e) {
      isAdminUser = false;
    }

    let playerState = null;
    try {
      const s = await withTimeout(sb.rpc('get_state'), 4000);
      if (s?.data) {
        playerState = s.data;
      } else if (s?.error) {
        console.warn('get_state error:', s.error);
      }
    } catch (e) {
      console.warn('get_state exception:', e);
    }

    if (playerState) {
      setMe(playerState);
      load();
    }
  } catch (err) {
    console.warn('Background sync error (safe):', err);
  }
})();

// ---------- PWA & Service Worker (Step 14) ----------
window.addEventListener('online', () => {
  toast('Koneksi terhubung kembali');
});

window.addEventListener('offline', () => {
  toast('Tidak ada koneksi. Pixel baru tidak bisa dipasang.');
});

if ('serviceWorker' in navigator) {
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) {
      refreshing = true;
      window.location.reload();
    }
  });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.update().catch(() => {});
      if (reg.waiting) {
        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      }
      reg.onupdatefound = () => {
        const inst = reg.installing;
        if (inst) {
          inst.onstatechange = () => {
            if (inst.state === 'installed' && navigator.serviceWorker.controller) {
              inst.postMessage({ type: 'SKIP_WAITING' });
            }
          };
        }
      };
    }).catch(err => console.warn('[PWA] SW register error:', err));
  });
}
</script>
